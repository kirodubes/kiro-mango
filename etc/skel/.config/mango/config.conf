# ════════════════════════════════════════════════════════════════════════
# Kiro mango — config.conf  (~/.config/mango/config.conf)
# ════════════════════════════════════════════════════════════════════════
# mangowc (wlroots, dwl-lineage) — Kiro's "smooth animated tiling" Wayland
# edition. Runtime key=value config + bind= keybinds; reloaded with SUPER+SHIFT+R.
# Kiro SUPER grammar (CTRL+ALT launchers, SUPER+F1..F12) on mango's tag/dwm model.
# Colours are Tokyo Night; scripts/set-theme.sh (pywal) rewrites them at login.
# Autostart lives in ~/.config/mango/autostart.sh (mango runs it on start).
# Reference: https://github.com/DreamMaoMao/mango/wiki
# ────────────────────────────────────────────────────────────────────────

# ── The identity: smooth animations + blur ──────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
animation_duration_open=400
animation_duration_close=600
animation_duration_move=400
animation_duration_tag=350
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1

blur=1
blur_layer=1
blur_params_num_passes=2
blur_params_radius=5

# ── Appearance — Tokyo Night (set-theme.sh/pywal rewrites the colour lines) ──
border_radius=8
borderpx=2
gappih=5
gappiv=5
gappoh=8
gappov=8
smartgaps=0
focused_opacity=1.0
unfocused_opacity=1.0
rootcolor=0x1a1b26ff
bordercolor=0x414868ff
focuscolor=0x7aa2f7ff
urgentcolor=0xf7768eff

# ── Layout / behaviour ──────────────────────────────────────────────────────
new_is_master=1
default_mfact=0.55
default_nmaster=1
sloppyfocus=1
focus_on_activate=1
cursor_size=24

# ── Input ───────────────────────────────────────────────────────────────────
repeat_rate=40
repeat_delay=600
numlockon=1
xkb_rules_layout=be,us
xkb_rules_options=compose:caps
tap_to_click=1
trackpad_natural_scrolling=1
disable_while_typing=1

# ── Tags: tile layout on all 9 ──────────────────────────────────────────────
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ════════════════════════════════════════════════════════════════════════
# Key bindings  (mod keys: super,ctrl,alt,shift,none — combine with +)
# ════════════════════════════════════════════════════════════════════════

# ── Applications & launchers (Kiro scheme) ──────────────────────────────────
bind=SUPER,Return,spawn,alacritty
bind=SUPER,t,spawn,alacritty
bind=SUPER+SHIFT,Return,spawn,thunar
bind=SUPER,e,spawn,code
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,Space,spawn,rofi -show drun
bind=SUPER+SHIFT,d,spawn,rofi -show run
bind=SUPER,r,spawn,rofi-theme-selector
bind=ALT,r,spawn,rofi-theme-selector
bind=SUPER,v,spawn,pavucontrol
bind=SUPER,o,spawn,hyprpicker -a

# CTRL+ALT launchers (Kiro scheme)
bind=CTRL+ALT,a,spawn,alacritty-tweak-tool
bind=CTRL+ALT,q,spawn,alacritty-tweak-tool
bind=CTRL+ALT,b,spawn,brave --password-store=basic
bind=CTRL+ALT,c,spawn,chromium -no-default-browser-check
bind=CTRL+ALT,g,spawn,chromium -no-default-browser-check
bind=CTRL+ALT,d,spawn,obs
bind=CTRL+ALT,e,spawn,archlinux-tweak-tool
bind=CTRL+ALT,f,spawn,firefox
bind=CTRL+ALT,i,spawn,kiro-iso-builder
bind=CTRL+ALT,m,spawn,mintstick -m iso
bind=CTRL+ALT,o,spawn,opera
bind=CTRL+ALT,p,spawn,pamac-manager
bind=CTRL+ALT,s,spawn,fish-tweak-tool
bind=CTRL+ALT,u,spawn,pavucontrol
bind=CTRL+ALT,v,spawn,vivaldi-stable
bind=CTRL+ALT,w,spawn,fastfetch-tweak-tool
bind=CTRL+ALT,z,spawn,fastfetch-tweak-tool
bind=CTRL+ALT,Return,spawn,alacritty
bind=CTRL+ALT,End,spawn,alacritty --class btop -e btop

# SUPER + F1..F12 app keys (Kiro scheme)
bind=SUPER,F1,spawn,firefox
bind=SUPER,F2,spawn,code
bind=SUPER,F3,spawn,inkscape
bind=SUPER,F4,spawn,gimp
bind=SUPER,F5,spawn,meld
bind=SUPER,F6,spawn,vlc
bind=SUPER,F7,spawn,virtualbox
bind=SUPER,F8,spawn,thunar
bind=SUPER,F9,spawn,virt-manager
bind=SUPER,F10,spawn,spotify
bind=SUPER,F11,spawn,rofi -show drun
bind=SUPER,F12,spawn,rofi -show drun

# ── Window management ───────────────────────────────────────────────────────
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,Space,togglefloating,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,n,switch_layout
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,g,togglegaps

# ── Tags (Kiro: SUPER view, SUPER+CTRL move+follow, SUPER+SHIFT send) ────────
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

# Monitor switch
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right

# ── Multimedia & hardware ───────────────────────────────────────────────────
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# ── Screenshots ─────────────────────────────────────────────────────────────
bind=NONE,Print,spawn,sh -c 'grim -g "$(slurp)" - | wl-copy'
bind=SUPER,Print,spawn,sh -c 'grim - | wl-copy'

# ── System & session ────────────────────────────────────────────────────────
bind=SUPER,x,spawn,archlinux-logout
bind=SUPER+SHIFT,x,spawn,kiro-powermenu
bind=SUPER+CTRL,s,spawn,kiro-keybindings
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,m,quit
bind=CTRL+ALT,k,spawn,archlinux-logout
bind=CTRL+ALT,l,spawn,archlinux-logout --settings
bind=CTRL+ALT,r,spawn,archlinux-betterlockscreen

# ── Mouse ───────────────────────────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
